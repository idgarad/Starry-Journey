# cargo-about configuration: which dependency licenses the release accepts
# and which targets to collect for. Used by scripts/release/package.ps1.
# Every license here must be compatible with Starry Journey's GPL-3.0-or-later.
accepted = [
    "GPL-3.0-or-later", # Starry Journey itself
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
